name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
  push: {branches: ["main", "master"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate Lowlighter Metrics Dashboard
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: pabeledp
          template: classic
          
          # Base layout
          base: header, activity, community, repositories, metadata
          base_indepth: yes
          config_timezone: Asia/Dhaka
          config_theme: dark
          
          # 1. PageSpeed Insights Gauge (ampabel.com)
          plugin_pagespeed: yes
          plugin_pagespeed_url: https://www.ampabel.com
          plugin_pagespeed_detailed: yes
          
          # 2. 3D Isometric Contributions Calendar
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          
          # 3. Coding Habits & Commit Activity Charts
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_trim: yes
          
          # 4. Programming Languages Breakdown
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_colors: github
          plugin_languages_limit: 8
          
          # 5. Mastered Topics & Tech Icons
          plugin_topics: yes
          plugin_topics_sort: stars
          plugin_topics_mode: icons
          plugin_topics_limit: 20
          
          # Output SVG commit settings
          output_action: commit
          committer_message: "build: update github-metrics dashboard [skip ci]"
